name: Bump Semgrep rules pin

# The shared semgrep workflow pins its rules to a fixed semgrep-rules commit
# for reproducibility. The pin lives in .github/semgrep-rules-commit.txt
# (outside .github/workflows, which the default GITHUB_TOKEN cannot push to).
# This opens a monthly PR moving the pin to the latest commit on
# semgrep-rules main, so new rules keep flowing in.
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Resolve latest semgrep-rules commit
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/semgrep/semgrep-rules/commits/main --jq .sha)
          current=$(tr -d '[:space:]' < .github/semgrep-rules-commit.txt)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$sha current=$current"
      - name: Validate new rules commit
        # Branches pushed with github.token do not trigger workflows, and
        # callers pin this repo by SHA, so no CI would ever exercise the new
        # rules. Validate the pin here instead: the commit must resolve and
        # contain every rule dir the shared semgrep workflow consumes.
        id: validate
        if: steps.pin.outputs.sha != steps.pin.outputs.current
        run: |
          set -euo pipefail
          sha="${{ steps.pin.outputs.sha }}"
          dir=$(mktemp -d "$RUNNER_TEMP/semgrep-rules-validate.XXXXXX")
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/semgrep/semgrep-rules.git "$dir"
          git -C "$dir" sparse-checkout init --cone
          git -C "$dir" sparse-checkout set \
            bash dockerfile go html javascript json php python ruby rust terraform typescript yaml
          git -C "$dir" fetch --depth 1 origin "$sha"
          git -C "$dir" checkout --detach "$sha"
          test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
          for d in bash dockerfile go html javascript json php python ruby rust terraform typescript yaml; do
            test -d "$dir/$d" || { echo "missing rules dir: $d" >&2; exit 1; }
          done
          echo "rules pin $sha validated" >> "$GITHUB_STEP_SUMMARY"
      - name: Open bump PR
        if: steps.validate.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ steps.pin.outputs.sha }}"
          # Stable branch keyed by the target SHA: retries, re-runs, and
          # concurrent manual/scheduled runs all converge on the same
          # branch and PR instead of opening duplicates.
          branch="bump-semgrep-rules-$sha"
          # The merge below creates a merge commit when main has advanced, so
          # the bot identity must be configured before it: a fresh runner has
          # no Git identity, and the merge would fail or be misattributed
          # under set -e.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git rev-parse --verify --quiet "origin/$branch" >/dev/null; then
            git checkout "$branch"
            # Merge, never rebase: the later push must stay fast-forward,
            # and set -e fails the job on a real conflict for human attention.
            git merge --no-edit origin/main
          else
            git checkout -b "$branch"
          fi
          printf '%s\n' "$sha" > .github/semgrep-rules-commit.txt
          git add .github/semgrep-rules-commit.txt
          if git diff --cached --quiet; then
            echo "pin already at $sha on $branch; nothing to commit"
          else
            git commit -m "Bump Semgrep rules pin to $sha"
          fi
          git push -u origin "$branch"
          existing=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "reusing existing open PR #$existing for $branch"
          else
            gh pr create --base main --head "$branch" \
              --title "Bump Semgrep rules pin" \
              --body "Monthly rules refresh: semgrep/semgrep-rules@$sha. The pin was smoke-validated in the bump run (commit resolves, all 13 consumed rule dirs present). Merge to roll it out to callers via the usual SHA-bump PRs."
          fi
