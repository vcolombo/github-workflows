name: Bump Semgrep rules pin

# The shared semgrep workflow pins its rules to a fixed semgrep-rules commit
# for reproducibility. This opens a monthly PR moving the pin to the latest
# commit on semgrep-rules main, so new rules keep flowing in.
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Resolve latest semgrep-rules commit
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/semgrep/semgrep-rules/commits/main --jq .sha)
          current=$(grep -E '^[[:space:]]*RULES_COMMIT:' .github/workflows/semgrep.yml | awk '{print $2}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$sha current=$current"
      - name: Validate new rules commit
        # Branches pushed with github.token do not trigger workflows, and
        # callers pin this repo by SHA, so no CI would ever exercise the new
        # rules. Validate the pin here instead: the commit must resolve and
        # contain every rule dir the shared semgrep workflow consumes.
        id: validate
        if: steps.pin.outputs.sha != steps.pin.outputs.current
        run: |
          set -euo pipefail
          sha="${{ steps.pin.outputs.sha }}"
          dir=$(mktemp -d "$RUNNER_TEMP/semgrep-rules-validate.XXXXXX")
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/semgrep/semgrep-rules.git "$dir"
          git -C "$dir" sparse-checkout init --cone
          git -C "$dir" sparse-checkout set \
            bash dockerfile go html javascript json php python ruby rust terraform typescript yaml
          git -C "$dir" fetch --depth 1 origin "$sha"
          git -C "$dir" checkout --detach "$sha"
          test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
          for d in bash dockerfile go html javascript json php python ruby rust terraform typescript yaml; do
            test -d "$dir/$d" || { echo "missing rules dir: $d" >&2; exit 1; }
          done
          echo "rules pin $sha validated" >> "$GITHUB_STEP_SUMMARY"
      - name: Open bump PR
        if: steps.validate.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ steps.pin.outputs.sha }}"
          sed -i -E "s/^([[:space:]]*RULES_COMMIT:[[:space:]]*).*/\1$sha/" .github/workflows/semgrep.yml
          grep -q "$sha" .github/workflows/semgrep.yml
          # run_id + run_attempt suffixes keep retries safe: a date-only name
          # collides when the workflow is re-run on the same day, and run_id
          # alone is unchanged across retries of the same run.
          branch="bump-semgrep-rules-$(date -u +%Y%m%d)-${{ github.run_id }}-${{ github.run_attempt }}"
          git checkout -b "$branch"
          git add .github/workflows/semgrep.yml
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Bump Semgrep rules pin to $sha"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Bump Semgrep rules pin" \
            --body "Monthly rules refresh: semgrep/semgrep-rules@$sha. The pin was smoke-validated in the bump run (commit resolves, all 13 consumed rule dirs present). Merge to roll it out to callers via the usual SHA-bump PRs."
