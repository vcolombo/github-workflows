name: Gitleaks

# Shared secret-leak scanner.
#
# Scan scope depends on the triggering event (the Gitleaks action picks the
# range): pull_request and push scan the commits in range; schedule and
# workflow_dispatch scan the full history. Pair PR callers with a weekly
# scheduled run so secrets committed long ago are covered too. The pinned
# action derives its PR range from a single, unpaginated API page and skips
# merges, so PRs it cannot fully cover (longer than one page, or containing
# merged side branches) get a supplemental full-range scan below.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  # The pinned action posts PR review comments by default
  # (pulls-create-review-comment); callers inherit this requirement.
  pull-requests: write

concurrency:
  group: gitleaks-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine commits beyond the action's first page
        id: tail
        # The pinned action lists PR commits once without pagination and
        # scans first..last-of-page, silently omitting later commits; the
        # list endpoint itself caps at 250 commits, so it cannot delimit the
        # remainder either. Count locally instead: the checkout holds the
        # full history, and the event carries the exact base/head SHAs.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          total=$(git rev-list --count "$BASE_SHA..$HEAD_SHA")
          merges=$(git rev-list --count --min-parents=2 "$BASE_SHA..$HEAD_SHA")
          if [ "$total" -gt 30 ] || [ "$merges" -gt 0 ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "PR has $total commits ($merges merges); supplemental full-range scan required"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "PR has $total commits without merges; action covers all"
          fi
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Scan full PR range beyond action coverage
        # The action scans first-parent, non-merge commits of the first API
        # page only. This reuses its installed gitleaks binary to scan the
        # entire PR range with no exclusions, so merged side branches and
        # commits past page/truncation caps cannot slip through. A leak here
        # fails the job with findings in the log.
        if: github.event_name == 'pull_request' && steps.tail.outputs.needed == 'true'
        run: |
          gitleaks detect --redact --exit-code=2 \
            --log-opts="${{ steps.tail.outputs.base }}..${{ steps.tail.outputs.head }}"
