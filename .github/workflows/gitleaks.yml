name: Gitleaks

# Shared secret-leak scanner.
#
# Scan scope depends on the triggering event (the Gitleaks action picks the
# range): pull_request and push scan the commits in range; schedule and
# workflow_dispatch scan the full history. Pair PR callers with a weekly
# scheduled run so secrets committed long ago are covered too.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  # The pinned action posts PR review comments by default
  # (pulls-create-review-comment); callers inherit this requirement.
  pull-requests: write

concurrency:
  group: gitleaks-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ github.token }}
