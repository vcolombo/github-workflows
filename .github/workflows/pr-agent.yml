name: PR-Agent (reusable)

# Shared PR-Agent code-review workflow. Reviews run through OpenRouter so one
# API key covers any model; the model is an input so callers can experiment
# without editing this file.
#
# Callers must pass:
#   secrets: inherit   (needs OPENROUTER_API_KEY as a repo/org Actions secret)
# and grant the calling job: pull-requests write, issues write, contents read.
on:
  workflow_call:
    inputs:
      model:
        description: LiteLLM model ID for reviews (e.g. openrouter/deepseek/deepseek-chat)
        required: false
        type: string
        default: openrouter/deepseek/deepseek-chat
      auto_review:
        description: Post an automatic review on opened/synchronized PRs
        required: false
        type: boolean
        default: true
      use_self_hosted:
        description: Use a repository-scoped Linux x64 self-hosted runner
        required: false
        type: boolean
        default: true
    secrets:
      OPENROUTER_API_KEY:
        description: OpenRouter API key for the review model
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-agent-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_agent:
    name: pr-agent
    # Fork-safety: never run secret-bearing jobs on self-hosted runners for fork PRs.
    if: ${{ !inputs.use_self_hosted || github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(inputs.use_self_hosted && '["self-hosted","Linux","X64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - name: PR-Agent review
        uses: the-pr-agent/pr-agent@1d01f24f455bb879c1d9c557ad7de3d72dcc7975 # v0.46.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          config.model: ${{ inputs.model }}
          config.fallback_models: ${{ format('["{0}"]', inputs.model) }}
          github_action_config.auto_review: ${{ inputs.auto_review && 'true' || 'false' }}
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
