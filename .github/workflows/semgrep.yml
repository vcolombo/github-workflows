name: Semgrep CE

on:
  workflow_call:
    inputs:
      use_self_hosted:
        description: Use a repository-scoped Linux x64 self-hosted runner
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: semgrep-ce
    runs-on: ${{ fromJSON(inputs.use_self_hosted && '["self-hosted","Linux","X64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    container:
      image: semgrep/semgrep@sha256:1623685c0f6388b0bc8d577a712bf92b88252aaa09d6d7e38943dafa10ed978c
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check out pinned Semgrep community rules
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: semgrep/semgrep-rules
          ref: 40b8c63f75dc7c22c8a77482d73bfb864b146f7e
          path: .semgrep-rules
          persist-credentials: false
          sparse-checkout: |
            bash
            dockerfile
            go
            html
            javascript
            json
            python
            ruby
            rust
            terraform
            typescript
            yaml
      - name: Scan with Semgrep Community Edition
        run: |
          semgrep scan --metrics=off --disable-version-check \
            --no-git-ignore \
            --x-ignore-semgrepignore-files \
            --exclude .semgrep-rules \
            --config .semgrep-rules/bash \
            --config .semgrep-rules/dockerfile \
            --config .semgrep-rules/go \
            --config .semgrep-rules/html \
            --config .semgrep-rules/javascript \
            --config .semgrep-rules/json \
            --config .semgrep-rules/python \
            --config .semgrep-rules/ruby \
            --config .semgrep-rules/rust \
            --config .semgrep-rules/terraform \
            --config .semgrep-rules/typescript \
            --config .semgrep-rules/yaml
